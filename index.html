<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f3eb" />
    <meta name="description" content="ASTRA keeps learning moving when connectivity stops." />
    <title>ASTRA - Learning continuity for every student</title>
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="18" fill="%23f8f3eb"/%3E%3Cpath d="M12 48 30 12l22 36h-8l-5-10H25l-5 10zM29 31h7l-4-9z" fill="%230c2947"/%3E%3Ccircle cx="31" cy="8" r="4" fill="%23d6643b"/%3E%3C/svg%3E' />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-nav" id="site-nav">
      <a class="brand" href="#home" aria-label="ASTRA home"><span class="brand-mark">A</span><span>ASTRA</span></a>
      <nav aria-label="Primary navigation">
        <a class="nav-link active" href="#home">Home</a>
        <a class="nav-link" href="#learning">Learning</a>
        <a class="nav-link" href="#ai-tutor">AI Tutor</a>
        <a class="nav-link" href="#scholarships">Scholarships</a>
        <a class="nav-link" href="#mentors">Mentors</a>
        <a class="nav-link" href="#career">Career Path</a>
      </nav>
      <a class="nav-cta" href="#career">Get Started</a>
      <button class="menu-button" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </header>

    <main>
      <section class="visual-section hero" id="home" aria-label="ASTRA home page">
        <img src="assets/home.png" alt="ASTRA homepage showing a student learning near a community hub" />
        <a class="image-hotspot hero-cta" href="#learning" aria-label="Explore ASTRA"></a>
        <a class="image-hotspot hero-demo" href="#learning" aria-label="See how ASTRA works"></a>
      </section>

      <section class="visual-section" id="learning" aria-label="Offline continuity layer">
        <img src="assets/continuity.png" alt="ASTRA offline learning flow from download to later sync" loading="lazy" />
      </section>

      <section class="visual-section" id="opportunity" aria-label="Learning to opportunity journey">
        <img src="assets/opportunity.png" alt="ASTRA learning signal to support to opportunity journey" loading="lazy" />
      </section>

      <section class="visual-section" id="ai-tutor" aria-label="Local AI support">
        <img src="assets/ai-tutor.png" alt="ASTRA local AI tutor answering a student question from local study material" loading="lazy" />
      </section>

      <section class="visual-section" id="scholarships" aria-label="Scholarship discovery">
        <img src="assets/scholarships.png" alt="ASTRA scholarship discovery and official application journey" loading="lazy" />
      </section>

      <section class="visual-section" id="mentors" aria-label="Trusted mentor guidance">
        <img src="assets/mentors.png" alt="ASTRA mentor guidance with a verified guest faculty mentor" loading="lazy" />
      </section>

      <section class="visual-section" id="career" aria-label="Career pathways">
        <img src="assets/career.png" alt="ASTRA career pathway from discovery to moving forward" loading="lazy" />
      </section>

      <section class="visual-section footer-visual" id="footer" aria-label="ASTRA footer">
        <img src="assets/footer.png" alt="ASTRA footer with support and exploration links" loading="lazy" />
      </section>
    </main>

    <button class="back-top" type="button" aria-label="Back to top">↑</button>
    <script src="script.js"></script>
  </body>
</html>
